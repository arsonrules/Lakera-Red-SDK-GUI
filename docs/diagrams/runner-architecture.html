<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a scan moves through the runner</title>
  <!-- Skin: Lakera Red Runner UI tokens (static/index.html, light theme). Font source: system. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f8fa;
      --color-ink:     #1f2328;
      --color-muted:   #59636e;
      --color-accent:  #cf222e;
      --font-sans:     ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif:    'Instrument Serif', ui-serif, Georgia, serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Lakera Red Runner</p>
    <h1>How a scan moves through the runner</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runner-architecture-title runner-architecture-desc">
        <title id="runner-architecture-title">How a scan moves through the runner</title>
        <desc id="runner-architecture-desc">Architecture of the Lakera Red Runner: the browser UI drives the runner API, whose scan driver polls the Lakera Red API for attacks and relays each one through the target adapter to your agent, whose traced tools can report back to Red.</desc>
        <defs>
          <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker>
          <marker id="arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#cf222e"/></marker>
          <marker id="arch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f6f8fa"/>

        <!-- Zones (before arrows and nodes) -->
        <rect x="192" y="232" width="528" height="112" rx="8"
              fill="rgba(31,35,40,0.02)" stroke="rgba(31,35,40,0.10)" stroke-width="0.8"/>
        <rect x="216" y="236" width="96" height="12" rx="2" fill="#f6f8fa"/>
        <text x="264" y="245" fill="#59636e" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              text-anchor="middle" letter-spacing="0.14em">LAKERA RED RUNNER</text>

        <rect x="736" y="232" width="176" height="264" rx="8"
              fill="rgba(31,35,40,0.02)" stroke="rgba(31,35,40,0.10)" stroke-width="0.8"/>
        <rect x="768" y="236" width="112" height="12" rx="2" fill="#f6f8fa"/>
        <text x="824" y="245" fill="#59636e" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              text-anchor="middle" letter-spacing="0.14em">YOUR AGENT'S RUNTIME</text>

        <!-- Arrows (behind boxes) -->
        <!-- Browser UI <-> Runner API: two fanned ports on the shared edges -->
        <line x1="160" y1="284" x2="208" y2="284" stroke="#0969da" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
        <path d="M 208,308 H 160" fill="none" stroke="#59636e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
        <!-- Runner API -> Scan driver -->
        <line x1="336" y1="296" x2="384" y2="296" stroke="#59636e" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
        <!-- Scan driver -> Lakera Red API (outbound poll; attacks come back in the response) -->
        <line x1="456" y1="264" x2="456" y2="136" stroke="#0969da" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
        <!-- Scan driver -> Target adapter: the attack path (accent) -->
        <line x1="528" y1="296" x2="576" y2="296" stroke="#cf222e" stroke-width="1.4" marker-end="url(#arch-arrow-accent)"/>
        <!-- Target adapter -> Your agent -->
        <line x1="704" y1="296" x2="752" y2="296" stroke="#0969da" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
        <!-- Your agent -> Agent tools -->
        <line x1="824" y1="328" x2="824" y2="416" stroke="#59636e" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
        <!-- Agent tools -> Lakera Red API (opt-in tracing, routed outside the agent zone) -->
        <path d="M 896,448 H 920 Q 928,448 928,440 V 112 Q 928,104 920,104 H 528"
              fill="none" stroke="#0969da" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow-link)"/>

        <!-- Arrow labels -->
        <rect x="170" y="264" width="28" height="12" rx="2" fill="#f6f8fa"/>
        <text x="184" y="273" fill="#0969da" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">REST</text>

        <rect x="172" y="316" width="24" height="12" rx="2" fill="#f6f8fa"/>
        <text x="184" y="325" fill="#59636e" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SSE</text>

        <rect x="342" y="276" width="36" height="12" rx="2" fill="#f6f8fa"/>
        <text x="360" y="285" fill="#59636e" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">START</text>

        <rect x="464" y="178" width="68" height="12" rx="2" fill="#f6f8fa"/>
        <text x="498" y="187" fill="#0969da" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">POLL · REPLY</text>

        <rect x="532" y="276" width="40" height="12" rx="2" fill="#f6f8fa"/>
        <text x="552" y="285" fill="#cf222e" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ATTACK</text>

        <rect x="706" y="276" width="44" height="12" rx="2" fill="#f6f8fa"/>
        <text x="728" y="285" fill="#0969da" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP/WS</text>

        <rect x="832" y="366" width="56" height="12" rx="2" fill="#f6f8fa"/>
        <text x="860" y="375" fill="#59636e" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text>

        <rect x="688" y="84" width="80" height="12" rx="2" fill="#f6f8fa"/>
        <text x="728" y="93" fill="#0969da" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">INTERCEPT_TOOL</text>

        <!-- Node: Lakera Red API (external) -->
        <rect x="384" y="72" width="144" height="64" rx="6" fill="#f6f8fa"/>
        <rect x="384" y="72" width="144" height="64" rx="6" fill="rgba(31,35,40,0.03)" stroke="rgba(31,35,40,0.30)" stroke-width="1"/>
        <rect x="392" y="78" width="32" height="12" rx="2" fill="transparent" stroke="rgba(31,35,40,0.22)" stroke-width="0.8"/>
        <text x="408" y="87" fill="#59636e" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">SAAS</text>
        <text x="456" y="108" fill="#1f2328" font-size="12" font-weight="600" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Lakera Red API</text>
        <text x="456" y="124" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">red-webhooks.lakera.ai</text>

        <!-- Node: Browser UI (input) -->
        <rect x="40" y="264" width="120" height="64" rx="6" fill="#f6f8fa"/>
        <rect x="40" y="264" width="120" height="64" rx="6" fill="rgba(89,99,110,0.10)" stroke="#59636e" stroke-width="1"/>
        <rect x="48" y="270" width="24" height="12" rx="2" fill="transparent" stroke="rgba(89,99,110,0.40)" stroke-width="0.8"/>
        <text x="60" y="279" fill="#59636e" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="100" y="300" fill="#1f2328" font-size="12" font-weight="600" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Browser UI</text>
        <text x="100" y="316" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">static/index.html</text>

        <!-- Node: Runner API (backend) -->
        <rect x="208" y="264" width="128" height="64" rx="6" fill="#f6f8fa"/>
        <rect x="208" y="264" width="128" height="64" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1"/>
        <rect x="216" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(31,35,40,0.40)" stroke-width="0.8"/>
        <text x="230" y="279" fill="#1f2328" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="272" y="300" fill="#1f2328" font-size="12" font-weight="600" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Runner API</text>
        <text x="272" y="316" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FastAPI · app.py</text>

        <!-- Node: Scan driver (focal) -->
        <rect x="384" y="264" width="144" height="64" rx="6" fill="#f6f8fa"/>
        <rect x="384" y="264" width="144" height="64" rx="6" fill="rgba(207,34,46,0.06)" stroke="#cf222e" stroke-width="1"/>
        <rect x="392" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(207,34,46,0.50)" stroke-width="0.8"/>
        <text x="406" y="279" fill="#cf222e" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">SDK</text>
        <text x="456" y="300" fill="#1f2328" font-size="12" font-weight="600" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Scan driver</text>
        <text x="456" y="316" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">lakera-red-sdk</text>

        <!-- Node: Target adapter (backend) -->
        <rect x="576" y="264" width="128" height="64" rx="6" fill="#f6f8fa"/>
        <rect x="576" y="264" width="128" height="64" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1"/>
        <rect x="584" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(31,35,40,0.40)" stroke-width="0.8"/>
        <text x="598" y="279" fill="#1f2328" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">I/O</text>
        <text x="640" y="300" fill="#1f2328" font-size="12" font-weight="600" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Target adapter</text>
        <text x="640" y="316" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">targets.py</text>

        <!-- Node: Your agent (external) -->
        <rect x="752" y="264" width="144" height="64" rx="6" fill="#f6f8fa"/>
        <rect x="752" y="264" width="144" height="64" rx="6" fill="rgba(31,35,40,0.03)" stroke="rgba(31,35,40,0.30)" stroke-width="1"/>
        <rect x="760" y="270" width="40" height="12" rx="2" fill="transparent" stroke="rgba(31,35,40,0.22)" stroke-width="0.8"/>
        <text x="780" y="279" fill="#59636e" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">TARGET</text>
        <text x="824" y="300" fill="#1f2328" font-size="12" font-weight="600" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Your agent</text>
        <text x="824" y="316" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">chat or model API</text>

        <!-- Node: Agent tools (optional, opt-in tracing) -->
        <rect x="752" y="416" width="144" height="64" rx="6" fill="#f6f8fa"/>
        <rect x="752" y="416" width="144" height="64" rx="6" fill="rgba(31,35,40,0.02)" stroke="rgba(31,35,40,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="760" y="422" width="28" height="12" rx="2" fill="transparent" stroke="rgba(31,35,40,0.22)" stroke-width="0.8"/>
        <text x="774" y="431" fill="#59636e" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">OPT</text>
        <text x="824" y="452" fill="#1f2328" font-size="12" font-weight="600" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Agent tools</text>
        <text x="824" y="468" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">intercept_tool</text>

        <!-- Callout 1: why the runner can sit next to a private agent -->
        <text x="40" y="96" fill="#1f2328" font-size="14" font-style="italic" font-family="'Instrument Serif', ui-serif, Georgia, serif">Outbound only: the runner polls Red,</text>
        <text x="40" y="114" fill="#1f2328" font-size="14" font-style="italic" font-family="'Instrument Serif', ui-serif, Georgia, serif">so your agent needs no public URL.</text>
        <path d="M 276,108 Q 400,212 452,212" fill="none" stroke="rgba(31,35,40,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="456" cy="212" r="2" fill="#1f2328"/>

        <!-- Callout 2: the session id that joins tool tracing to the scan -->
        <text x="40" y="420" fill="#1f2328" font-size="14" font-style="italic" font-family="'Instrument Serif', ui-serif, Georgia, serif">One {{session_id}} per session: sent to your agent,</text>
        <text x="40" y="438" fill="#1f2328" font-size="14" font-style="italic" font-family="'Instrument Serif', ui-serif, Georgia, serif">bound in Red, so traced tool calls join the scan.</text>
        <path d="M 364,432 Q 640,432 640,332" fill="none" stroke="rgba(31,35,40,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="640" cy="328" r="2" fill="#1f2328"/>

        <!-- Legend strip -->
        <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(31,35,40,0.10)" stroke-width="0.8"/>
        <text x="40" y="536" fill="#59636e" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="548" width="14" height="10" rx="2" fill="rgba(207,34,46,0.06)" stroke="#cf222e" stroke-width="1"/>
        <text x="60" y="556" fill="#59636e" font-size="8.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">Focal component</text>

        <rect x="168" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#1f2328" stroke-width="1"/>
        <text x="188" y="556" fill="#59636e" font-size="8.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">Runner component</text>

        <rect x="296" y="548" width="14" height="10" rx="2" fill="rgba(31,35,40,0.03)" stroke="rgba(31,35,40,0.30)" stroke-width="1"/>
        <text x="316" y="556" fill="#59636e" font-size="8.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">External service</text>

        <rect x="416" y="548" width="14" height="10" rx="2" fill="rgba(89,99,110,0.10)" stroke="#59636e" stroke-width="1"/>
        <text x="436" y="556" fill="#59636e" font-size="8.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">User input</text>

        <rect x="504" y="548" width="14" height="10" rx="2" fill="rgba(31,35,40,0.02)" stroke="rgba(31,35,40,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="524" y="556" fill="#59636e" font-size="8.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">Opt-in</text>

        <line x1="576" y1="553" x2="604" y2="553" stroke="#0969da" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
        <text x="612" y="556" fill="#59636e" font-size="8.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">HTTP call</text>

        <line x1="676" y1="553" x2="704" y2="553" stroke="#cf222e" stroke-width="1.4" marker-end="url(#arch-arrow-accent)"/>
        <text x="712" y="556" fill="#59636e" font-size="8.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">Attack path</text>

        <line x1="784" y1="553" x2="812" y2="553" stroke="#59636e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
        <text x="820" y="556" fill="#59636e" font-size="8.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">Async / return</text>
      </svg>
    </div>
  </div>
</body>
</html>
